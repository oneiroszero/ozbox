name: Build image

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths-ignore:
      - "README.md"
  schedule:
    - cron: "17 4 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata for base image
        id: meta_base
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=base,enable={{is_default_branch}}
            type=ref,event=branch,suffix=-base
            type=ref,event=tag
            type=ref,event=tag,suffix=-base
            type=sha,prefix=sha-,suffix=-base

      - name: Build and publish base image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: base
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          build-args: |
            CACHE_BUST=${{ github.run_id }}
          labels: ${{ steps.meta_base.outputs.labels }}
          tags: ${{ steps.meta_base.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadata for web image
        id: meta_web
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=web,enable={{is_default_branch}}
            type=ref,event=branch,suffix=-web
            type=ref,event=tag,suffix=-web
            type=sha,prefix=sha-,suffix=-web

      - name: Build and publish web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: web
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          build-args: |
            CACHE_BUST=${{ github.run_id }}
          labels: ${{ steps.meta_web.outputs.labels }}
          tags: ${{ steps.meta_web.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadata for RE image
        id: meta_re
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=re,enable={{is_default_branch}}
            type=ref,event=branch,suffix=-re
            type=ref,event=tag,suffix=-re
            type=sha,prefix=sha-,suffix=-re

      - name: Build and publish RE image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: re
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          build-args: |
            CACHE_BUST=${{ github.run_id }}
          labels: ${{ steps.meta_re.outputs.labels }}
          tags: ${{ steps.meta_re.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadata for full image
        id: meta_full
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=full,enable={{is_default_branch}}
            type=ref,event=branch,suffix=-full
            type=ref,event=tag,suffix=-full
            type=sha,prefix=sha-,suffix=-full

      - name: Build and publish full image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: full
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          build-args: |
            CACHE_BUST=${{ github.run_id }}
          labels: ${{ steps.meta_full.outputs.labels }}
          tags: ${{ steps.meta_full.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
